[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-pass"
version = "0.2.0"
description = "SAGE-Pass intelligent password security assessment orchestration service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "openai>=1.68,<3.0",
  "pypinyin>=0.55,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
